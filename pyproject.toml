[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensource-alternative-agent"
version = "0.1.0"
description = "Long-running GitHub alternative-finder agent demonstrating context engineering with LangGraph, OpenSpec, OpenAI, hooks, skills, and subagents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "langgraph>=1.2.0,<2",
  "requests>=2.32.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.0",
  "pandas>=2.2.0",
  "matplotlib>=3.9.0",
  "tiktoken>=0.8.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "ipython>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_agent"]

[tool.ruff]
line-length = 100

